name: RainX OTA Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  CI: "1"
jobs:
  publish-ota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo Babel preset
        run: npx expo install babel-preset-expo

      - name: Typecheck
        run: npm run typecheck

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch production \
            --message "RainX OTA update"
