name: Build RainX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  CI: "1"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Check Expo login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build release APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json

      - name: Download APK
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const payload = JSON.parse(
            fs.readFileSync("eas-build.json", "utf8")
          );

          const build = Array.isArray(payload) ? payload[0] : payload;
          const url =
            build &&
            build.artifacts &&
            build.artifacts.buildUrl;

          if (!url) {
            console.error("EAS completed without an APK URL.");
            console.error(JSON.stringify(payload, null, 2));
            process.exit(1);
          }

          fs.writeFileSync("eas-build-url.txt", url);
          NODE

          curl \
            --fail \
            --location \
            --retry 3 \
            "$(cat eas-build-url.txt)" \
            --output RainX-Android-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RainX-Android-APK
          path: RainX-Android-APK.apk
          if-no-files-found: error
